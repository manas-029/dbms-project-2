{% extends "base.html" %}
{% block title %}Forgot Password | Digital Footprint Tracker{% endblock %}
{% block content %}
<section class="auth-shell">
    <form class="auth-card" method="post">
        <h1>Reset simulation</h1>
        <p class="muted">For a college demo, this safely simulates an email reset token.</p>
        <label>Email<input type="email" name="email" required></label>
        <button class="button full" type="submit">Generate reset link</button>
        {% if demo_token %}<textarea readonly rows="5">{{ demo_token }}</textarea>{% endif %}
    </form>
</section>
{% endblock %}
