services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: digital_footprint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    environment:
      SECRET_KEY: production-change-me
      JWT_SECRET_KEY: production-jwt-change-me
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/digital_footprint
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  postgres_data:
